<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 640" width="760" height="640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="How a 111 GB model runs on a 64 GB Mac: reading your message through the carousel, writing the answer through the expert cache, and where the time goes">
<rect width="760" height="640" fill="#ffffff"/>
<defs>
<marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6670"/></marker>
<marker id="f1w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8730f"/></marker>
<marker id="f1t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e72"/></marker>
</defs>
<text x="20" y="30" font-size="18" font-weight="700" fill="#1b2228">How a 111 GB model runs on a 64 GB Mac</text>
<text x="20" y="50" font-size="12" fill="#5a6670">The model is 24,576 small specialists ("experts"). They live on the SSDs; only the ones needed right now come into memory.</text>

<rect x="10" y="66" width="740" height="128" rx="8" fill="#f2f8f8"/>
<text x="22" y="86" font-size="13" font-weight="700" fill="#0f6e72">1 · READING YOUR MESSAGE</text>
<text x="238" y="86" font-size="11.5" fill="#5a6670">(prefill: the whole prompt at once)</text>
<g font-size="11.5" fill="#1b2228" text-anchor="middle">
<rect x="20" y="98" width="140" height="62" rx="6" fill="#ffffff" stroke="#c4ccd2"/>
<text x="90" y="120" font-weight="600">Your message</text><text x="90" y="136">plus the chat so far,</text><text x="90" y="150">e.g. 30,000 tokens</text>
<rect x="185" y="98" width="165" height="62" rx="6" fill="#ffffff" stroke="#c4ccd2"/>
<text x="267" y="120" font-weight="600">Needs nearly every expert</text><text x="267" y="136">so many tokens that each</text><text x="267" y="150">layer uses almost all 512</text>
<rect x="375" y="98" width="190" height="62" rx="6" fill="#0f6e72"/>
<text x="470" y="118" font-weight="700" fill="#ffffff">The carousel (1.4 GiB)</text><text x="470" y="134" fill="#e2f0f0">a conveyor belt: the SSDs load</text><text x="470" y="148" fill="#e2f0f0">the next layer while GPU works</text>
<rect x="590" y="98" width="150" height="62" rx="6" fill="#1b2228"/>
<text x="665" y="120" font-weight="600" fill="#ffffff">GPU does the maths</text><text x="665" y="136" fill="#cfd8de">barely waits:</text><text x="665" y="150" fill="#cfd8de">the belt is always full</text>
</g>
<line x1="160" y1="129" x2="182" y2="129" stroke="#5a6670" stroke-width="1.5" marker-end="url(#f1a)"/>
<line x1="350" y1="129" x2="372" y2="129" stroke="#5a6670" stroke-width="1.5" marker-end="url(#f1a)"/>
<line x1="565" y1="129" x2="587" y2="129" stroke="#5a6670" stroke-width="1.5" marker-end="url(#f1a)"/>

<rect x="10" y="276" width="740" height="160" rx="8" fill="#f6f7f8"/>
<text x="22" y="226" font-size="11.5" font-weight="700" fill="#1b2228">The model's home: two SSDs</text>
<text x="22" y="242" font-size="11" fill="#5a6670">the same file on both, experts split 53 / 47,</text>
<text x="22" y="256" font-size="11" fill="#5a6670">12.3 GB/s together</text>
<g font-size="11.5" text-anchor="middle">
<rect x="300" y="214" width="160" height="46" rx="6" fill="#fbf1e1" stroke="#b8730f"/>
<text x="380" y="233" font-weight="600" fill="#1b2228">Internal SSD</text><text x="380" y="249" fill="#5a6670">6.5 GB/s · 53%</text>
<rect x="480" y="214" width="160" height="46" rx="6" fill="#fbf1e1" stroke="#b8730f"/>
<text x="560" y="233" font-weight="600" fill="#1b2228">External SSD (TB5)</text><text x="560" y="249" fill="#5a6670">5.7 GB/s · 47%</text>
</g>
<line x1="470" y1="212" x2="470" y2="164" stroke="#0f6e72" stroke-width="2" marker-end="url(#f1t)"/>
<text x="478" y="206" font-size="10.5" fill="#0f6e72">streams every expert, layer by layer</text>
<text x="22" y="182" font-size="11.5" fill="#1b2228" stroke="#f2f8f8" stroke-width="5" paint-order="stroke"><tspan font-weight="700">Speed limit:</tspan> whichever is slower, the SSDs or the GPU → 390–520 tokens read per second</text>
<line x1="470" y1="262" x2="470" y2="314" stroke="#b8730f" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#f1w)"/>
<text x="478" y="290" font-size="10.5" fill="#b8730f">fetches the 1 in 4 that's missing: the GPU waits</text>

<text x="22" y="296" font-size="13" font-weight="700" fill="#1b2228">2 · WRITING THE ANSWER</text>
<text x="222" y="296" font-size="11.5" fill="#5a6670">(decode: a few tokens at a time)</text>
<g font-size="11.5" fill="#1b2228" text-anchor="middle">
<rect x="20" y="318" width="140" height="62" rx="6" fill="#ffffff" stroke="#c4ccd2"/>
<text x="90" y="340" font-weight="600">A helper guesses</text><text x="90" y="356">a small draft model</text><text x="90" y="370">guesses up to 5 tokens</text>
<rect x="185" y="318" width="165" height="62" rx="6" fill="#ffffff" stroke="#c4ccd2"/>
<text x="267" y="340" font-weight="600">Pick the experts</text><text x="267" y="356">on each of 48 layers,</text><text x="267" y="370">10 of 512 per token</text>
<rect x="375" y="318" width="190" height="62" rx="6" fill="#e2f0f0" stroke="#0f6e72"/>
<text x="470" y="338" font-weight="700" fill="#0f6e72">Expert cache (28 GiB RAM)</text><text x="470" y="354">keeps the ~10,000 used lately</text><text x="470" y="368">3 in 4 are already there</text>
<rect x="590" y="318" width="150" height="62" rx="6" fill="#1b2228"/>
<text x="665" y="340" font-weight="600" fill="#ffffff">GPU checks guesses</text><text x="665" y="356" fill="#cfd8de">all in one pass,</text><text x="665" y="370" fill="#cfd8de">keeps the right ones</text>
</g>
<line x1="160" y1="349" x2="182" y2="349" stroke="#5a6670" stroke-width="1.5" marker-end="url(#f1a)"/>
<line x1="350" y1="349" x2="372" y2="349" stroke="#5a6670" stroke-width="1.5" marker-end="url(#f1a)"/>
<line x1="565" y1="349" x2="587" y2="349" stroke="#5a6670" stroke-width="1.5" marker-end="url(#f1a)"/>
<path d="M665 382 C 665 400, 90 400, 90 384" fill="none" stroke="#5a6670" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f1a)"/>
<text x="378" y="410" font-size="10.5" fill="#5a6670" text-anchor="middle">repeat until the answer is done</text>
<text x="22" y="428" font-size="11.5" fill="#1b2228"><tspan font-weight="700">Speed limit:</tspan> waiting for missing experts to arrive from the SSDs → about 17 tokens written per second</text>

<text x="20" y="462" font-size="14" font-weight="700" fill="#1b2228">Where the time goes for one written token</text>
<text x="20" y="480" font-size="11" fill="#5a6670">Milliseconds per token. The orange and grey parts are the GPU standing idle between layers.</text>
<g font-size="11.5">
<text x="20" y="512" fill="#1b2228" font-weight="600">Tool calls</text>
<rect x="110" y="498" width="30.0" height="22" fill="#7a8a96"/>
<rect x="140" y="498" width="155.6" height="22" fill="#1b2228"/>
<rect x="295.6" y="498" width="85.2" height="22" fill="#d98a1c"/>
<rect x="380.8" y="498" width="48.6" height="22" fill="#c4ccd2"/>
<text x="437" y="514" fill="#1b2228">35 ms · guesses usually right</text>
<text x="20" y="550" fill="#1b2228" font-weight="600">Prose</text>
<rect x="110" y="536" width="50.0" height="22" fill="#7a8a96"/>
<rect x="160" y="536" width="291.2" height="22" fill="#1b2228"/>
<rect x="451.2" y="536" width="158.8" height="22" fill="#d98a1c"/>
<rect x="610" y="536" width="97.8" height="22" fill="#c4ccd2"/>
<text x="712" y="552" fill="#1b2228">66 ms</text>
<rect x="110" y="578" width="12" height="12" fill="#7a8a96"/><text x="128" y="588" fill="#1b2228">helper guessing</text>
<rect x="238" y="578" width="12" height="12" fill="#1b2228"/><text x="256" y="588" fill="#1b2228">GPU working</text>
<rect x="350" y="578" width="12" height="12" fill="#d98a1c"/><text x="368" y="588" fill="#1b2228">waiting for the SSDs</text>
<rect x="508" y="578" width="12" height="12" fill="#c4ccd2"/><text x="526" y="588" fill="#1b2228">handover between layers</text>
</g>
<text x="20" y="614" font-size="10.5" fill="#5a6670">Prose is slower because more guesses are wrong, and every guess, right or wrong, needs its own experts fetched.</text>
<text x="20" y="630" font-size="10.5" fill="#5a6670">Source: study C1 profile, measured before the final fix to the layer handover (+7% writing).</text>
</svg>
