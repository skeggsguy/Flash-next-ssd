<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 780" width="760" height="780" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Before: the engine's own one-layer guess, so the SSD has one layer's time and the GPU waits. After: a trained guesser fetches two layers ahead, a second trained guesser tops up one layer ahead, and every guess is kept until its layer runs. Writing +4.2% coding and +8.2% chat from the two-layer guesser, then +7.5% and +7.3% more from the one-layer guesser.">
<rect width="760" height="780" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1b2228">Before: the engine's own guess, one layer ahead</text>
<text x="20" y="48" font-size="11.5" fill="#5a6670">The router guesses the next layer's experts, so the SSD has only one layer's time to fetch them; the GPU waits</text>
<text x="20" y="80" font-size="12" font-weight="600" fill="#1b2228">SSD</text><text x="20" y="114" font-size="12" font-weight="600" fill="#1b2228">GPU</text>
<rect x="70" y="66" width="160" height="22" fill="#d98a1c" stroke="#ffffff" stroke-width="2"/>
<text x="150.0" y="80.8" font-size="10.5" fill="#ffffff" text-anchor="middle">experts for n+1</text>
<rect x="230" y="66" width="160" height="22" fill="#d98a1c" stroke="#ffffff" stroke-width="2"/>
<text x="310.0" y="80.8" font-size="10.5" fill="#ffffff" text-anchor="middle">experts for n+2</text>
<rect x="70" y="100" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="130.0" y="114.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n</text>
<rect x="190" y="100" width="40" height="22" fill="#eef1f3"/>
<rect x="230" y="100" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="290.0" y="114.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n+1</text>
<rect x="350" y="100" width="40" height="22" fill="#eef1f3"/>
<rect x="390" y="100" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="450.0" y="114.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n+2</text>
<text x="210" y="138" font-size="10.5" fill="#5a6670" text-anchor="middle">wait</text><text x="370" y="138" font-size="10.5" fill="#5a6670" text-anchor="middle">wait</text>
<line x1="510" y1="60" x2="510" y2="130" stroke="#9a5b00" stroke-dasharray="3 3"/><text x="506" y="146" font-size="11" fill="#9a5b00" text-anchor="end">done</text>
<rect x="540" y="62" width="202" height="64" rx="6" fill="#f6f7f8"/>
<text x="641" y="84" font-size="12" font-weight="600" fill="#1b2228" text-anchor="middle">Only 1 in 4 guesses used</text>
<text x="641" y="101" font-size="11" fill="#1b2228" text-anchor="middle">half were evicted from the</text><text x="641" y="115" font-size="11" fill="#1b2228" text-anchor="middle">cache before their layer came</text>
<text x="20" y="190" font-size="16" font-weight="700" fill="#1b2228">After: two trained guesses, each kept until its layer runs</text>
<text x="20" y="208" font-size="11.5" fill="#5a6670">On layer n the two-layer guesser fetches layer n+2's experts; a layer later the one-layer guesser tops up what it missed</text>
<text x="20" y="247" font-size="12" font-weight="600" fill="#1b2228">SSD</text><text x="20" y="305" font-size="12" font-weight="600" fill="#1b2228">GPU</text>
<rect x="70" y="222" width="160" height="16" fill="#d98a1c" stroke="#ffffff" stroke-width="2"/>
<text x="150.0" y="233.8" font-size="10.5" fill="#ffffff" text-anchor="middle">experts for n+2</text>
<rect x="190" y="242" width="160" height="16" fill="#d98a1c" stroke="#ffffff" stroke-width="2"/>
<text x="270.0" y="253.8" font-size="10.5" fill="#ffffff" text-anchor="middle">experts for n+3</text>
<rect x="190" y="262" width="60" height="16" fill="#f2c27a" stroke="#ffffff" stroke-width="2"/>
<text x="220.0" y="273.8" font-size="10.5" fill="#1b2228" text-anchor="middle">n+2 top-up</text>
<rect x="310" y="262" width="60" height="16" fill="#f2c27a" stroke="#ffffff" stroke-width="2"/>
<text x="340.0" y="273.8" font-size="10.5" fill="#1b2228" text-anchor="middle">n+3 top-up</text>
<line x1="232" y1="230" x2="308" y2="230" stroke="#0f6e72" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="270" y="226" font-size="10" fill="#0f6e72" text-anchor="middle">kept</text>
