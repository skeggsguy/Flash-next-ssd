<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 712" width="760" height="712" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Before: one layer ahead, the SSD has one layer's time and the GPU waits. After: the trained two-layer guesser fetches experts two layers ahead, the one-layer guesser tops up a layer later, and each guess stays in the cache until used. Writing about +12% coding and +16% chat, estimated from two runs.">
<rect width="760" height="712" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1b2228">Before: guess one layer ahead</text>
<text x="20" y="48" font-size="11.5" fill="#5a6670">The router guesses the next layer's experts, so the SSD has only one layer's time to fetch them; the GPU waits</text>
<text x="20" y="80" font-size="12" font-weight="600" fill="#1b2228">SSD</text><text x="20" y="114" font-size="12" font-weight="600" fill="#1b2228">GPU</text>
<rect x="70" y="66" width="160" height="22" fill="#d98a1c" stroke="#ffffff" stroke-width="2"/>
<text x="150.0" y="80.8" font-size="10.5" fill="#ffffff" text-anchor="middle">experts for n+1</text>
<rect x="230" y="66" width="160" height="22" fill="#d98a1c" stroke="#ffffff" stroke-width="2"/>
<text x="310.0" y="80.8" font-size="10.5" fill="#ffffff" text-anchor="middle">experts for n+2</text>
<rect x="70" y="100" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="130.0" y="114.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n</text>
<rect x="190" y="100" width="40" height="22" fill="#eef1f3"/>
<rect x="230" y="100" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="290.0" y="114.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n+1</text>
<rect x="350" y="100" width="40" height="22" fill="#eef1f3"/>
<rect x="390" y="100" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="450.0" y="114.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n+2</text>
<text x="210" y="138" font-size="10.5" fill="#5a6670" text-anchor="middle">wait</text><text x="370" y="138" font-size="10.5" fill="#5a6670" text-anchor="middle">wait</text>
<line x1="510" y1="60" x2="510" y2="130" stroke="#9a5b00" stroke-dasharray="3 3"/><text x="506" y="146" font-size="11" fill="#9a5b00" text-anchor="end">done</text>
<rect x="540" y="62" width="202" height="64" rx="6" fill="#f6f7f8"/>
<text x="641" y="84" font-size="12" font-weight="600" fill="#1b2228" text-anchor="middle">Only 1 in 4 guesses used</text>
<text x="641" y="101" font-size="11" fill="#1b2228" text-anchor="middle">half were evicted from the</text><text x="641" y="115" font-size="11" fill="#1b2228" text-anchor="middle">cache before their layer came</text>
<text x="20" y="190" font-size="16" font-weight="700" fill="#1b2228">After: guess two layers ahead, top up one ahead, keep both</text>
<text x="20" y="208" font-size="11.5" fill="#5a6670">The two-layer guess gives the SSD two layers' time; a layer later the one-layer guess tops up what it missed</text>
<text x="20" y="247" font-size="12" font-weight="600" fill="#1b2228">SSD</text><text x="20" y="305" font-size="12" font-weight="600" fill="#1b2228">GPU</text>
<rect x="70" y="222" width="160" height="16" fill="#d98a1c" stroke="#ffffff" stroke-width="2"/>
<text x="150.0" y="233.8" font-size="10.5" fill="#ffffff" text-anchor="middle">made on n: for n+2</text>
<rect x="190" y="242" width="160" height="16" fill="#d98a1c" stroke="#ffffff" stroke-width="2"/>
<text x="270.0" y="253.8" font-size="10.5" fill="#ffffff" text-anchor="middle">made on n+1: for n+3</text>
<rect x="190" y="262" width="100" height="16" fill="#f2c27a" stroke="#ffffff" stroke-width="2"/>
<text x="240.0" y="273.8" font-size="10.5" fill="#1b2228" text-anchor="middle">top-up for n+2</text>
<line x1="232" y1="230" x2="308" y2="230" stroke="#0f6e72" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="270" y="226" font-size="10" fill="#0f6e72" text-anchor="middle">kept</text>
<line x1="352" y1="250" x2="428" y2="250" stroke="#0f6e72" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="390" y="246" font-size="10" fill="#0f6e72" text-anchor="middle">kept</text>
<line x1="292" y1="270" x2="308" y2="270" stroke="#0f6e72" stroke-width="2.5" stroke-dasharray="5 3"/>
<rect x="70" y="290" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="130.0" y="307.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n</text>
<rect x="190" y="290" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="250.0" y="307.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n+1</text>
<rect x="310" y="290" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="370.0" y="307.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n+2</text>
<line x1="430" y1="216" x2="430" y2="320" stroke="#0f6e72" stroke-dasharray="3 3"/><text x="436" y="316" font-size="11" fill="#0f6e72">done</text>
<rect x="490" y="222" width="252" height="90" rx="6" fill="#e2f0f0"/>
<text x="616" y="243" font-size="12" font-weight="600" fill="#0f6e72" text-anchor="middle">Measured: most guesses used</text>
<text x="616" y="261" font-size="11" fill="#1b2228" text-anchor="middle">two-layer 84%, one-layer 65-71%</text>
<text x="616" y="279" font-size="11" fill="#1b2228" text-anchor="middle">writing about +12% coding, +16% chat</text>
<text x="616" y="297" font-size="10.5" fill="#5a6670" text-anchor="middle">output unchanged</text>
<rect x="70" y="336" width="12" height="12" fill="#d98a1c"/><text x="88" y="346" font-size="11.5" fill="#1b2228">SSD fetching two layers ahead</text>
<rect x="290" y="336" width="12" height="12" fill="#f2c27a"/><text x="308" y="346" font-size="11.5" fill="#1b2228">SSD topping up one layer ahead</text>
<line x1="520" y1="342" x2="542" y2="342" stroke="#0f6e72" stroke-width="2.5" stroke-dasharray="5 3"/><text x="548" y="346" font-size="11.5" fill="#1b2228">kept until its layer runs</text>
<rect x="70" y="356" width="12" height="12" fill="#1b2228"/><text x="88" y="366" font-size="11.5" fill="#1b2228">GPU working</text>
<rect x="290" y="356" width="12" height="12" fill="#eef1f3" stroke="#c4ccd2"/><text x="308" y="366" font-size="11.5" fill="#1b2228">GPU waiting</text>
<text x="20" y="410" font-size="14" font-weight="700" fill="#1b2228">Writing gain by conversation length, both guessers</text>
<text x="20" y="428" font-size="11" fill="#5a6670">Against the engine's own guess with no keep rule. Estimated: the two guessers' measured gains multiplied (see below).</text>
<g font-size="12" fill="#1b2228">
<text x="20" y="459" font-weight="600">Chat, all</text>
<rect x="230" y="448" width="241.5" height="14" fill="#0f6e72"/>
<text x="477.5" y="459" font-weight="600">+16.1%</text>
<text x="36" y="479">short</text>
<rect x="230" y="468" width="268.5" height="14" fill="#8fc3c4"/>
<text x="504.5" y="479">+17.9%</text>
<text x="36" y="499">medium</text>
<rect x="230" y="488" width="244.5" height="14" fill="#8fc3c4"/>
<text x="480.5" y="499">+16.3%</text>
<text x="36" y="519">long</text>
<rect x="230" y="508" width="142.5" height="14" fill="#8fc3c4"/>
<text x="378.5" y="519">+9.5%</text>
<text x="20" y="549" font-weight="600">Coding agent, all</text>
<rect x="230" y="538" width="180.0" height="14" fill="#0f6e72"/>
<text x="416.0" y="549" font-weight="600">+12.0%</text>
<text x="36" y="569">short</text>
<rect x="230" y="558" width="147.0" height="14" fill="#8fc3c4"/>
<text x="383.0" y="569">+9.8%</text>
<text x="36" y="589">medium</text>
<rect x="230" y="578" width="322.5" height="14" fill="#8fc3c4"/>
<text x="558.5" y="589">+21.5%</text>
<text x="36" y="609">long</text>
<rect x="230" y="598" width="190.5" height="14" fill="#8fc3c4"/>
<text x="426.5" y="609">+12.7%</text>
<text x="36" y="629">100K+ tokens of context</text>
<rect x="230" y="618" width="141.0" height="14" fill="#8fc3c4"/>
<text x="377.0" y="629">+9.4%</text>
</g>
<line x1="230" y1="442" x2="230" y2="638" stroke="#5a6670"/>
<text x="20" y="662" font-size="10.5" fill="#5a6670">Schematic timing above. Gains: the two-layer guesser with the keep rule (study test K-final: 24 coding conversations at high effort, 24 chats</text>
<text x="20" y="677" font-size="10.5" fill="#5a6670">at medium) times the one-layer guesser on top of it (T43: 12 + 12, another day), each A/B/A, never run together. 28 GiB cache, two SSDs,</text>
<text x="20" y="692" font-size="10.5" fill="#5a6670">draft head on. Guesses used: 25% of the engine's own one-layer guesses before; after, 84% of two-layer and 65-71% of one-layer guesses.</text>
</svg>
