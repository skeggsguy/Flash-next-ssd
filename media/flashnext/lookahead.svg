<line x1="230" y1="464" x2="230" y2="708" stroke="#5a6670"/>
<text x="20" y="730" font-size="10.5" fill="#5a6670">Schematic timing above. Measured: K-final, the two-layer guesser and keep rule against neither, 24 coding conversations (high effort) and</text>
<text x="20" y="745" font-size="10.5" fill="#5a6670">24 chats (medium); T43, the one-layer guesser on top of them, 12 + 12, another day. Both A/B/A, 28 GiB cache, two SSDs, draft head on.</text>
<text x="20" y="760" font-size="10.5" fill="#5a6670">Guesses used: 25% of the engine's own one-layer guesses before; after, 84% of two-layer and 65-71% of one-layer guesses.</text>
