<rect x="70" y="290" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="130.0" y="307.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n</text>
<rect x="190" y="290" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="250.0" y="307.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n+1</text>
<rect x="310" y="290" width="120" height="22" fill="#1b2228" stroke="#ffffff" stroke-width="2"/>
<text x="370.0" y="307.8" font-size="10.5" fill="#ffffff" text-anchor="middle">layer n+2</text>
<line x1="430" y1="216" x2="430" y2="320" stroke="#0f6e72" stroke-dasharray="3 3"/><text x="436" y="316" font-size="11" fill="#0f6e72">done</text>
<rect x="490" y="222" width="252" height="92" rx="6" fill="#e2f0f0"/>
<text x="616" y="242" font-size="12" font-weight="600" fill="#0f6e72" text-anchor="middle">Measured: early fetches used</text>
<text x="616" y="259" font-size="11" fill="#1b2228" text-anchor="middle">two-layer 84%, one-layer 65-71%</text>
<text x="616" y="276" font-size="11" fill="#1b2228" text-anchor="middle">writing +4.2% coding, +8.2% chat,</text>
<text x="616" y="291" font-size="11" fill="#1b2228" text-anchor="middle">then +7.5% and +7.3% more</text>
<text x="616" y="306" font-size="10.5" fill="#5a6670" text-anchor="middle">output unchanged</text>
<rect x="70" y="336" width="12" height="12" fill="#d98a1c"/><text x="88" y="346" font-size="11.5" fill="#1b2228">SSD fetching guessed experts</text>
<rect x="280" y="336" width="12" height="12" fill="#f2c27a"/><text x="298" y="346" font-size="11.5" fill="#1b2228">SSD topping up (one-layer guess)</text>
<line x1="498" y1="342" x2="520" y2="342" stroke="#0f6e72" stroke-width="2.5" stroke-dasharray="5 3"/><text x="526" y="346" font-size="11.5" fill="#1b2228">kept until its layer runs</text>
<rect x="70" y="356" width="12" height="12" fill="#1b2228"/><text x="88" y="366" font-size="11.5" fill="#1b2228">GPU working</text>
<rect x="280" y="356" width="12" height="12" fill="#eef1f3" stroke="#c4ccd2"/><text x="298" y="366" font-size="11.5" fill="#1b2228">GPU waiting</text>
<text x="20" y="408" font-size="14" font-weight="700" fill="#1b2228">Writing gain by conversation length</text>
<text x="20" y="426" font-size="11" fill="#5a6670">Each guesser against the setup just before it. The two-layer gain fades on the longest conversations; the one-layer gain does not.</text>
<rect x="230" y="442" width="12" height="12" fill="#0f6e72"/><text x="248" y="452" font-size="11.5" fill="#1b2228">two-layer guesser + keep rule (K-final)</text>
<rect x="490" y="442" width="12" height="12" fill="#6a4fa3"/><text x="508" y="452" font-size="11.5" fill="#1b2228">one-layer guesser on top (T43)</text>
