<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 260" width="760" height="260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Second SSD gain: reading in 40% before, 15% after; writing 15% both; time to first word 33% and 31% less">
<rect width="760" height="260" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1b2228">Gain from adding a second SSD</text>
<rect x="420" y="18" width="12" height="12" fill="#c4ccd2"/><text x="438" y="29" font-size="11.5" fill="#1b2228">before carousel</text>
<rect x="560" y="18" width="12" height="12" fill="#0f6e72"/><text x="578" y="29" font-size="11.5" fill="#1b2228">final setup</text>
<g font-size="12" fill="#1b2228">
<text x="20" y="74" font-weight="600">Reading in</text>
<rect x="200" y="58" width="484.8" height="16" fill="#c4ccd2"/><text x="690" y="71">+40%</text>
<rect x="200" y="78" width="180.0" height="16" fill="#0f6e72"/><text x="386" y="91">+15%</text>
<text x="20" y="134" font-weight="600">Writing</text>
<rect x="200" y="118" width="177.6" height="16" fill="#c4ccd2"/><text x="383" y="131">+14.8%</text>
<rect x="200" y="138" width="184.8" height="16" fill="#0f6e72"/><text x="390" y="151">+15.4%</text>
<text x="20" y="194" font-weight="600">Time to first word</text>
<text x="20" y="209" font-size="10.5" fill="#5a6670">(shorter)</text>
<rect x="200" y="178" width="396" height="16" fill="#c4ccd2"/><text x="602" y="191">−33%</text>
<rect x="200" y="198" width="372" height="16" fill="#0f6e72"/><text x="578" y="211">−31%</text>
</g>
<line x1="200" y1="50" x2="200" y2="220" stroke="#5a6670"/>
<text x="20" y="246" font-size="10.5" fill="#5a6670">Before: test E-paper, 60 prompts, 32 GiB cache, no drafting. Final: test R-drives, 24 prompts, 28 GiB cache, drafting on. Both A/B/A.</text>
</svg>
