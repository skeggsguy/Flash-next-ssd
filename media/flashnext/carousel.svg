<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Before: SSD and GPU take turns. After: the carousel keeps both busy at once.">
<rect width="760" height="360" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1b2228">Before: waves. The SSD and GPU take turns</text>
<text x="20" y="48" font-size="11.5" fill="#5a6670">The expert cache doubles as the loading area; each layer arrives in ~5 waves; time = SSD + GPU</text>
<text x="20" y="80" font-size="12" font-weight="600" fill="#1b2228">SSD</text>
<text x="20" y="114" font-size="12" font-weight="600" fill="#1b2228">GPU</text>
<g fill="#d98a1c"><rect x="70" y="66" width="56" height="22"/><rect x="182" y="66" width="56" height="22"/><rect x="294" y="66" width="56" height="22"/><rect x="406" y="66" width="56" height="22"/><rect x="518" y="66" width="56" height="22"/><rect x="630" y="66" width="56" height="22"/></g>
<g fill="#1b2228"><rect x="126" y="100" width="56" height="22"/><rect x="238" y="100" width="56" height="22"/><rect x="350" y="100" width="56" height="22"/><rect x="462" y="100" width="56" height="22"/><rect x="574" y="100" width="56" height="22"/><rect x="686" y="100" width="56" height="22"/></g>
<g fill="#eef1f3"><rect x="70" y="100" width="56" height="22"/><rect x="182" y="100" width="56" height="22"/><rect x="294" y="100" width="56" height="22"/><rect x="406" y="100" width="56" height="22"/><rect x="518" y="100" width="56" height="22"/><rect x="630" y="100" width="56" height="22"/></g>
<text x="98" y="138" font-size="10.5" fill="#5a6670" text-anchor="middle">GPU idle</text>
<line x1="742" y1="60" x2="742" y2="130" stroke="#9a5b00" stroke-dasharray="3 3"/>
<text x="738" y="146" font-size="11" fill="#9a5b00" text-anchor="end">done</text>
<text x="20" y="190" font-size="16" font-weight="700" fill="#1b2228">After: carousel. A separate belt keeps both busy</text>
<text x="20" y="208" font-size="11.5" fill="#5a6670">A 1.44 GiB ring buffer (1.25 layers, 4 parts a layer) filled ahead by the SSDs; time = the slower of SSD and GPU</text>
<text x="20" y="240" font-size="12" font-weight="600" fill="#1b2228">SSD</text>
<text x="20" y="274" font-size="12" font-weight="600" fill="#1b2228">GPU</text>
<g fill="#d98a1c"><rect x="70" y="226" width="56" height="22"/><rect x="128" y="226" width="56" height="22"/><rect x="186" y="226" width="56" height="22"/><rect x="244" y="226" width="56" height="22"/><rect x="302" y="226" width="56" height="22"/><rect x="360" y="226" width="56" height="22"/></g>
<g fill="#1b2228"><rect x="126" y="260" width="56" height="22"/><rect x="184" y="260" width="56" height="22"/><rect x="242" y="260" width="56" height="22"/><rect x="300" y="260" width="56" height="22"/><rect x="358" y="260" width="56" height="22"/><rect x="416" y="260" width="56" height="22"/></g>
<line x1="472" y1="220" x2="472" y2="290" stroke="#0f6e72" stroke-dasharray="3 3"/>
<text x="478" y="246" font-size="11" fill="#0f6e72">done</text>
<rect x="520" y="226" width="222" height="58" rx="6" fill="#e2f0f0"/>
<text x="631" y="248" font-size="12" font-weight="600" fill="#0f6e72" text-anchor="middle">Measured: reading in +32%</text>
<text x="631" y="266" font-size="11" fill="#1b2228" text-anchor="middle">time to first word −28%</text>
<text x="631" y="279" font-size="10.5" fill="#5a6670" text-anchor="middle">output bit-identical</text>
<rect x="70" y="316" width="12" height="12" fill="#d98a1c"/><text x="88" y="326" font-size="11.5" fill="#1b2228">SSD loading experts</text>
<rect x="220" y="316" width="12" height="12" fill="#1b2228"/><text x="238" y="326" font-size="11.5" fill="#1b2228">GPU working on them</text>
<rect x="376" y="316" width="12" height="12" fill="#eef1f3" stroke="#c4ccd2"/><text x="394" y="326" font-size="11.5" fill="#1b2228">GPU waiting</text>
<text x="20" y="350" font-size="10.5" fill="#5a6670">Schematic timing. Measured on 12 real assistant turns, 30 GiB cache, two SSDs (study test RR-room).</text>
</svg>
